<!DOCTYPE html>
<html {{ language_attributes() }}>
<head>
    <meta charset="{{ bloginfo('charset') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ wp_title('|', true, 'right') }} {{ bloginfo('name') }}</title>
    
    <!-- Performance: Preload Critical Fonts -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyfMZg.ttf" as="font" type="font/ttf" crossorigin>

    <!-- Performance: Critical CSS Inlined (Placeholder for PHP) -->
    <style>
        :root { --color-primary: #0052ff; }
        body { visibility: visible; opacity: 1; transition: opacity 0.2s; }
        .th-container { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 1rem; }
        .skip-link { position: absolute; top: -40px; left: 0; background: var(--color-primary); color: white; padding: 8px; z-index: 100; transition: top 0.3s; }
        .skip-link:focus { top: 0; }
    </style>

    <!-- Non-critical CSS: Async Loading -->
    <link rel="stylesheet" href="style.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="layout.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="components.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="utilities.css" media="print" onload="this.media='all'">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    {{ wp_head() }}
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body {{ body_class() }}>
    <a href="#main-content" class="skip-link">{{ __('跳过导航直接进入内容', 'techhub') }}</a>
    
    <div id="root">
        <!-- SSR Placeholder: Content will be rendered here by WP for SEO -->
        {{ is_front_page() ? '<h1>' . get_bloginfo('description') . '</h1>' : '' }}
    </div>

    {{ wp_footer() }}
</body>
</html>
